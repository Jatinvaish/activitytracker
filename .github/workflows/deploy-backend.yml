name: Deploy Backend to Render

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '*.md'

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" | jq .
          echo "✅ Render deploy triggered"
