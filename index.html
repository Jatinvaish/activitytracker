<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activity Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f0f; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header { padding: 0.65rem 1.25rem; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; }
    header h1 { font-size: 0.95rem; font-weight: 600; flex: 1; }
    .ver { font-size: 0.7rem; color: #555; }
    .badge { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.18rem 0.6rem; border-radius: 999px; font-size: 0.7rem; font-weight: 500; white-space: nowrap; }
    .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .badge.online  { background: #1e3a2f; color: #4caf87; }
    .badge.offline { background: #3a1e1e; color: #cf6679; }
    .badge.checking{ background: #2a2a1e; color: #c8a84b; }

    #updateBanner { display: none; padding: 0.45rem 1.25rem; background: #1e2f3a; border-bottom: 1px solid #2a3f50; font-size: 0.8rem; color: #7ac0e0; align-items: center; gap: 1rem; }
    #updateBanner.visible { display: flex; }
    .prog { flex: 1; height: 3px; background: #2a3f50; border-radius: 2px; overflow: hidden; }
    .prog-fill { height: 100%; background: #4a9fc8; transition: width 0.3s; }
    #updateBanner button { background: #4a9fc8; color: #0f0f0f; border: none; border-radius: 4px; padding: 0.25rem 0.7rem; font-size: 0.75rem; font-weight: 600; cursor: pointer; }

    .layout { display: flex; flex: 1; overflow: hidden; }

    aside { width: 220px; background: #111; border-right: 1px solid #222; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
    aside h2 { padding: 0.9rem 0.9rem 0.4rem; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: #555; flex-shrink: 0; }
    #recentList { overflow-y: auto; padding: 0 0.65rem 0.75rem; display: flex; flex-direction: column; gap: 0.35rem; }
    .card { background: #1a1a1a; border: 1px solid #252525; border-radius: 6px; padding: 0.5rem 0.65rem; font-size: 0.75rem; animation: fadeIn 0.2s; }
    .card .t { color: #555; font-size: 0.65rem; margin-bottom: 0.15rem; }
    .card .u { color: #4caf87; font-size: 0.65rem; font-weight: 600; margin-bottom: 0.1rem; }
    .card .a { color: #b0b0b0; line-height: 1.35; word-break: break-word; }
    .card .thumb { margin-top: 0.35rem; border-radius: 4px; overflow: hidden; max-height: 60px; }
    .card .thumb img { width: 100%; object-fit: cover; display: block; }

    main { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 1.25rem; gap: 0.85rem; }

    .toolbar { display: flex; gap: 0.5rem; flex-shrink: 0; flex-wrap: wrap; }
    .field { display: flex; flex-direction: column; gap: 0.2rem; }
    .field label { font-size: 0.65rem; color: #666; text-transform: uppercase; letter-spacing: 0.06em; }
    input[type="text"] { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 6px; padding: 0.45rem 0.75rem; color: #e0e0e0; font-size: 0.85rem; outline: none; transition: border-color 0.15s; }
    input[type="text"]::placeholder { color: #3a3a3a; }
    input[type="text"]:focus { border-color: #4caf87; }
    #usernameInput { width: 140px; }
    #activityInput { flex: 1; min-width: 200px; }

    .btn { border: none; border-radius: 6px; padding: 0.45rem 0.9rem; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s; white-space: nowrap; }
    .btn:hover { opacity: 0.82; }
    .btn:disabled { opacity: 0.35; cursor: default; }
    .btn-green  { background: #4caf87; color: #0a0a0a; }
    .btn-dark   { background: #252525; color: #c0c0c0; border: 1px solid #333; }
    .btn-shot   { background: #2a3a4a; color: #7ac0e0; border: 1px solid #3a4f60; }

    .preview-wrap { display: none; background: #151515; border: 1px solid #2a2a2a; border-radius: 6px; overflow: hidden; position: relative; flex-shrink: 0; }
    .preview-wrap.visible { display: block; }
    .preview-wrap img { max-height: 120px; width: 100%; object-fit: contain; display: block; }
    .preview-wrap .rm { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.7); border: none; color: #cf6679; border-radius: 4px; padding: 0.1rem 0.35rem; font-size: 0.7rem; cursor: pointer; }

    .table-wrap { flex: 1; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    thead th { text-align: left; padding: 0.4rem 0.65rem; border-bottom: 1px solid #2a2a2a; color: #555; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.07em; position: sticky; top: 0; background: #0f0f0f; }
    tbody td { padding: 0.55rem 0.65rem; border-bottom: 1px solid #171717; color: #b0b0b0; vertical-align: top; }
    tbody tr:hover td { background: #141414; }
    .date-sep td { background: #161616; color: #555; font-size: 0.7rem; letter-spacing: 0.05em; padding: 0.3rem 0.65rem; }
    .empty { color: #3a3a3a; }
    .tag { display: inline-block; padding: 0.1rem 0.45rem; border-radius: 4px; font-size: 0.67rem; font-weight: 600; }
    .tag.ok      { background: #1a3a2a; color: #4caf87; }
    .tag.err     { background: #3a1a1a; color: #cf6679; }
    .tag.pending { background: #252515; color: #c8a84b; }
    .thumb-cell img { width: 80px; height: 45px; object-fit: cover; border-radius: 4px; cursor: pointer; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; } }
  </style>
</head>
<body>

<header>
  <h1>Activity Tracker</h1>
  <span id="version" class="ver"></span>
  <span id="serverBadge" class="badge checking">Connecting…</span>
</header>

<div id="updateBanner">
  <span id="updateMsg"></span>
  <div class="prog"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  <button id="installBtn" style="display:none" onclick="installUpdate()">Restart & Install</button>
</div>

<div class="layout">
  <aside>
    <h2>Recent</h2>
    <div id="recentList"></div>
  </aside>

  <main>
    <div class="toolbar">
      <div class="field">
        <label>Your Name</label>
        <input type="text" id="usernameInput" placeholder="e.g. Jatin" />
      </div>
      <div class="field" style="flex:1">
        <label>Activity</label>
        <input type="text" id="activityInput" placeholder="What did you do? Press Enter to log…" />
      </div>
      <div class="field" style="justify-content:flex-end">
        <label>&nbsp;</label>
        <div style="display:flex;gap:0.4rem">
          <button class="btn btn-shot" id="shotBtn" onclick="captureScreen()">📷 Screenshot</button>
          <button class="btn btn-green" id="logBtn">Log</button>
        </div>
      </div>
    </div>

    <div class="preview-wrap" id="previewWrap">
      <img id="previewImg" src="" alt="screenshot" />
      <button class="rm" onclick="clearShot()">✕ Remove</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:90px">Time</th>
            <th style="width:100px">User</th>
            <th>Activity</th>
            <th style="width:100px">Screenshot</th>
            <th style="width:70px">Synced</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="5" class="empty">No activities logged yet.</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script>
  const { ipcRenderer, desktopCapturer } = require('electron');

  // ── Backend config ────────────────────────────────────────────────────────
  const BACKEND_URL = 'https://activitytracker-gvnr.onrender.com';
  const API_SECRET  = '71ddb21c90749e011a1fa72d77da08ce6ef4f7227dc3996a27a540a7a0b31b6f';

  // ── Version ──────────────────────────────────────────────────────────────
  ipcRenderer.invoke('app-version').then(v => {
    document.getElementById('version').textContent = 'v' + v;
  });

  // Load saved username
  const savedUser = localStorage.getItem('username') || '';
  document.getElementById('usernameInput').value = savedUser;
  document.getElementById('usernameInput').addEventListener('change', e => {
    localStorage.setItem('username', e.target.value.trim());
  });

  // ── Auto-update ──────────────────────────────────────────────────────────
  const banner   = document.getElementById('updateBanner');
  const updateMsg= document.getElementById('updateMsg');
  const progFill = document.getElementById('progFill');
  const installBtn = document.getElementById('installBtn');

  ipcRenderer.on('update-status', (_, d) => {
    if (d.event === 'available') {
      banner.classList.add('visible');
      updateMsg.textContent = `Update v${d.version} available — downloading…`;
    } else if (d.event === 'progress') {
      progFill.style.width = d.percent + '%';
      updateMsg.textContent = `Downloading… ${d.percent}%`;
    } else if (d.event === 'downloaded') {
      progFill.style.width = '100%';
      updateMsg.textContent = `v${d.version} ready.`;
      installBtn.style.display = 'inline-block';
    } else if (d.event === 'error') {
      banner.classList.remove('visible');
    }
  });

  function installUpdate() { ipcRenderer.send('install-update'); }

  // ── Screenshot ───────────────────────────────────────────────────────────
  let pendingScreenshot = null;

  async function captureScreen() {
    try {
      const sources = await desktopCapturer.getSources({ types: ['screen'], thumbnailSize: { width: 1920, height: 1080 } });
      if (!sources.length) return;
      pendingScreenshot = sources[0].thumbnail.toDataURL();
      document.getElementById('previewImg').src = pendingScreenshot;
      document.getElementById('previewWrap').classList.add('visible');
    } catch (e) {
      console.error('Screenshot failed:', e);
    }
  }

  function clearShot() {
    pendingScreenshot = null;
    document.getElementById('previewImg').src = '';
    document.getElementById('previewWrap').classList.remove('visible');
  }

  // ── State ────────────────────────────────────────────────────────────────
  const logs = [];

  function fmt(d) { return new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function groupByDate(items) {
    const groups = {};
    items.forEach(i => {
      const day = new Date(i.time).toLocaleDateString('en-GB');
      if (!groups[day]) groups[day] = [];
      groups[day].push(i);
    });
    return groups;
  }

  function renderTable() {
    const tbody = document.getElementById('tbody');
    if (!logs.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">No activities logged yet.</td></tr>';
      return;
    }
    const groups = groupByDate(logs);
    const days = Object.keys(groups).reverse();
    let html = '';
    days.forEach(day => {
      html += `<tr class="date-sep"><td colspan="5">── ${day} ──</td></tr>`;
      groups[day].slice().reverse().forEach(l => {
        const thumb = l.screenshot
          ? `<img src="${l.screenshot}" onclick="expandImg(this)" title="Click to expand" />`
          : '—';
        html += `<tr>
          <td>${fmt(l.time)}</td>
          <td style="color:#4caf87">${esc(l.username)}</td>
          <td>${esc(l.activity)}</td>
          <td class="thumb-cell">${thumb}</td>
          <td><span class="tag ${l.sync}">${l.sync === 'ok' ? 'Synced' : l.sync === 'err' ? 'Error' : 'Pending'}</span></td>
        </tr>`;
      });
    });
    tbody.innerHTML = html;
  }

  function renderRecent() {
    const list = document.getElementById('recentList');
    const recent = logs.slice(-6).reverse();
    list.innerHTML = recent.map(l => `
      <div class="card">
        <div class="t">${fmt(l.time)}</div>
        <div class="u">${esc(l.username)}</div>
        <div class="a">${esc(l.activity)}</div>
        ${l.screenshot ? `<div class="thumb"><img src="${l.screenshot}" /></div>` : ''}
      </div>
    `).join('');
  }

  function expandImg(img) {
    window.open(img.src, '_blank');
  }

  async function logActivity() {
    const activity = document.getElementById('activityInput').value.trim();
    const username = document.getElementById('usernameInput').value.trim() || 'User';
    if (!activity) return;

    localStorage.setItem('username', username);

    const entry = { activity, username, time: new Date().toISOString(), screenshot: pendingScreenshot, sync: 'pending' };
    logs.push(entry);
    document.getElementById('activityInput').value = '';
    const shot = pendingScreenshot;
    clearShot();
    renderTable();
    renderRecent();

    try {
      const res = await fetch(`${BACKEND_URL}/log`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-secret': API_SECRET },
        body: JSON.stringify({ activity, username, timestamp: entry.time, screenshotBase64: shot }),
      });
      entry.sync = res.ok ? 'ok' : 'err';
    } catch {
      entry.sync = 'err';
    }
    renderTable();
    renderRecent();
  }

  document.getElementById('logBtn').addEventListener('click', logActivity);
  document.getElementById('activityInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') logActivity();
  });

  // ── Server status ────────────────────────────────────────────────────────
  const badge = document.getElementById('serverBadge');
  async function ping() {
    try {
      const r = await fetch(`${BACKEND_URL}/status`);
      const d = await r.json();
      badge.textContent = d.status === 'running' ? 'Connected' : 'Server Error';
      badge.className = 'badge ' + (d.status === 'running' ? 'online' : 'offline');
    } catch {
      badge.textContent = 'Offline';
      badge.className = 'badge offline';
    }
  }
  ping();
  setInterval(ping, 10000);
</script>
</body>
</html>
