<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activity Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 0.75rem 1.5rem;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }
    header h1 { font-size: 1rem; font-weight: 600; flex: 1; }
    .version { font-size: 0.72rem; color: #555; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 500;
      white-space: nowrap;
    }
    .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .badge.online   { background: #1e3a2f; color: #4caf87; }
    .badge.offline  { background: #3a1e1e; color: #cf6679; }
    .badge.checking { background: #2a2a1e; color: #c8a84b; }

    /* Update banner */
    #updateBanner {
      display: none;
      padding: 0.55rem 1.5rem;
      background: #1e2f3a;
      border-bottom: 1px solid #2a3f50;
      font-size: 0.82rem;
      color: #7ac0e0;
      align-items: center;
      gap: 1rem;
    }
    #updateBanner.visible { display: flex; }
    #updateBanner .progress { flex: 1; height: 4px; background: #2a3f50; border-radius: 2px; overflow: hidden; }
    #updateBanner .progress-fill { height: 100%; background: #4a9fc8; transition: width 0.3s; }
    #updateBanner button {
      background: #4a9fc8; color: #0f0f0f; border: none; border-radius: 4px;
      padding: 0.3rem 0.8rem; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    }

    .layout { display: flex; flex: 1; overflow: hidden; }

    aside {
      width: 240px;
      background: #131313;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    aside h2 {
      padding: 1rem 1rem 0.5rem;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #555;
      flex-shrink: 0;
    }
    #recentList {
      overflow-y: auto;
      padding: 0 0.75rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .log-card {
      background: #1a1a1a;
      border: 1px solid #252525;
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      font-size: 0.78rem;
      animation: fadeIn 0.2s ease;
    }
    .log-card .time { color: #555; font-size: 0.68rem; margin-bottom: 0.15rem; }
    .log-card .text { color: #b8b8b8; line-height: 1.4; word-break: break-word; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 1.5rem;
      gap: 1rem;
    }

    .input-row { display: flex; gap: 0.6rem; flex-shrink: 0; }
    input[type="text"] {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 0.55rem 0.9rem;
      color: #e0e0e0;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]::placeholder { color: #444; }
    input[type="text"]:focus { border-color: #4caf87; }

    .btn-primary {
      background: #4caf87;
      color: #0a0a0a;
      border: none;
      border-radius: 6px;
      padding: 0.55rem 1.1rem;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.4; cursor: default; }

    .table-wrap { flex: 1; overflow-y: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.83rem;
    }
    thead th {
      text-align: left;
      padding: 0.45rem 0.75rem;
      border-bottom: 1px solid #2a2a2a;
      color: #555;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      position: sticky;
      top: 0;
      background: #0f0f0f;
    }
    tbody td {
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid #181818;
      color: #b8b8b8;
    }
    tbody tr:hover td { background: #141414; }
    .empty { color: #444; font-size: 0.82rem; }

    .tag {
      display: inline-block;
      padding: 0.1rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 500;
    }
    .tag.sheet  { background: #1a3a2a; color: #5abf8a; }
    .tag.error  { background: #3a1a1a; color: #cf6679; }
    .tag.pending{ background: #2a2a1a; color: #b8a44a; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>

<header>
  <h1>Activity Tracker</h1>
  <span id="version" class="version"></span>
  <span id="serverBadge" class="badge checking">Connecting…</span>
</header>

<div id="updateBanner">
  <span id="updateMsg">Checking for updates…</span>
  <div class="progress" id="progressWrap" style="display:none">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
  <button id="installBtn" style="display:none" onclick="installUpdate()">Restart &amp; Install</button>
</div>

<div class="layout">
  <aside>
    <h2>Recent</h2>
    <div id="recentList"></div>
  </aside>

  <main>
    <div class="input-row">
      <input type="text" id="activityInput" placeholder="Describe an activity and press Enter…" />
      <button class="btn-primary" id="logBtn">Log</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:140px">Time</th>
            <th>Activity</th>
            <th style="width:80px">Synced</th>
          </tr>
        </thead>
        <tbody id="activityBody">
          <tr><td colspan="3" class="empty">No activities logged yet.</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script>
  const { ipcRenderer } = require('electron');

  // ── Version ──────────────────────────────────────────────────────────────
  ipcRenderer.invoke('app-version').then(v => {
    document.getElementById('version').textContent = `v${v}`;
  });

  // ── Auto-update ──────────────────────────────────────────────────────────
  const banner   = document.getElementById('updateBanner');
  const updateMsg= document.getElementById('updateMsg');
  const progressWrap = document.getElementById('progressWrap');
  const progressFill = document.getElementById('progressFill');
  const installBtn   = document.getElementById('installBtn');

  ipcRenderer.on('update-status', (_, data) => {
    switch (data.event) {
      case 'available':
        banner.classList.add('visible');
        updateMsg.textContent = `Update v${data.version} available — downloading…`;
        progressWrap.style.display = 'block';
        break;
      case 'progress':
        progressFill.style.width = `${data.percent}%`;
        updateMsg.textContent = `Downloading update… ${data.percent}%`;
        break;
      case 'downloaded':
        progressWrap.style.display = 'none';
        updateMsg.textContent = `v${data.version} ready to install.`;
        installBtn.style.display = 'inline-block';
        break;
      case 'error':
        banner.classList.remove('visible');
        break;
    }
  });

  function installUpdate() {
    ipcRenderer.send('install-update');
  }

  // ── State ────────────────────────────────────────────────────────────────
  const activities = [];

  function fmt(d) {
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function renderTable() {
    const tbody = document.getElementById('activityBody');
    if (!activities.length) {
      tbody.innerHTML = '<tr><td colspan="3" class="empty">No activities logged yet.</td></tr>';
      return;
    }
    tbody.innerHTML = activities.slice().reverse().map(a => `
      <tr>
        <td>${fmt(a.time)}</td>
        <td>${escHtml(a.label)}</td>
        <td><span class="tag ${a.syncStatus}">${a.syncStatus === 'sheet' ? 'Synced' : a.syncStatus === 'error' ? 'Error' : 'Pending'}</span></td>
      </tr>
    `).join('');
  }

  function renderRecent() {
    const list = document.getElementById('recentList');
    const recent = activities.slice(-6).reverse();
    list.innerHTML = recent.map(a => `
      <div class="log-card">
        <div class="time">${fmt(a.time)}</div>
        <div class="text">${escHtml(a.label)}</div>
      </div>
    `).join('');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function logActivity() {
    const input = document.getElementById('activityInput');
    const label = input.value.trim();
    if (!label) return;

    const entry = { label, time: new Date(), syncStatus: 'pending' };
    activities.push(entry);
    input.value = '';
    renderTable();
    renderRecent();

    // Push to server → Google Sheets
    try {
      const res = await fetch('http://127.0.0.1:3056/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ activity: label }),
      });
      entry.syncStatus = res.ok ? 'sheet' : 'error';
    } catch {
      entry.syncStatus = 'error';
    }
    renderTable();
    renderRecent();
  }

  document.getElementById('logBtn').addEventListener('click', logActivity);
  document.getElementById('activityInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') logActivity();
  });

  // ── Server status ping ───────────────────────────────────────────────────
  const serverBadge = document.getElementById('serverBadge');

  async function pingServer() {
    try {
      const res = await fetch('http://127.0.0.1:3056/status');
      const data = await res.json();
      if (data.status === 'running') {
        serverBadge.textContent = 'Server Online';
        serverBadge.className = 'badge online';
      }
    } catch {
      serverBadge.textContent = 'Server Offline';
      serverBadge.className = 'badge offline';
    }
  }

  pingServer();
  setInterval(pingServer, 10000);
</script>
</body>
</html>
